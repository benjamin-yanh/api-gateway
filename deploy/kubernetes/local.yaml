apiVersion: v1
kind: Namespace
metadata:
  name: new-api-local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-data
  namespace: new-api-local
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: new-api-local
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: new-api-local
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: new-api-secrets
                  key: redis-password
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: control
  namespace: new-api-local
spec:
  selector:
    app: admin
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: new-api-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      initContainers:
        - name: wait-for-redis
          image: redis:7-alpine
          command: ["sh", "-c", "until redis-cli -h redis -a \"$REDIS_PASSWORD\" ping | grep -q PONG; do sleep 2; done"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: new-api-secrets
                  key: redis-password
      containers:
        - name: admin
          image: new-api-control:local
          imagePullPolicy: Never
          args: ["--log-dir", "/app/logs"]
          env:
            - name: SQL_DSN
              valueFrom:
                secretKeyRef:
                  name: new-api-database
                  key: SQL_DSN
                  optional: true
            - name: REDIS_CONN_STRING
              valueFrom:
                secretKeyRef:
                  name: new-api-secrets
                  key: redis-connection-string
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: new-api-secrets
                  key: session-secret
            - name: CRYPTO_SECRET
              valueFrom:
                secretKeyRef:
                  name: new-api-secrets
                  key: crypto-secret
            - name: NODE_TYPE
              value: master
            - name: NODE_NAME
              value: local-admin-1
            - name: TZ
              value: Asia/Shanghai
            - name: ERROR_LOG_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: app-data
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: relay
  namespace: new-api-local
spec:
  selector:
    app: relay
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: new-api-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      initContainers:
        - name: wait-for-admin
          image: busybox:1.37
          command: ["sh", "-c", "until wget -q -O - http://control:3000/healthz | grep -q control; do sleep 2; done"]
      containers:
        - name: relay
          image: new-api-relay:local
          imagePullPolicy: Never
          args: ["--log-dir", "/app/logs"]
          env:
            - name: SQL_DSN
              valueFrom:
                secretKeyRef:
                  name: new-api-database
                  key: SQL_DSN
                  optional: true
            - name: REDIS_CONN_STRING
              valueFrom:
                secretKeyRef:
                  name: new-api-secrets
                  key: redis-connection-string
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: new-api-secrets
                  key: session-secret
            - name: CRYPTO_SECRET
              valueFrom:
                secretKeyRef:
                  name: new-api-secrets
                  key: crypto-secret
            - name: NODE_TYPE
              value: slave
            - name: NODE_NAME
              value: local-relay-1
            - name: TZ
              value: Asia/Shanghai
            - name: ERROR_LOG_ENABLED
              value: "true"
            - name: BATCH_UPDATE_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: app-data
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: new-api-local
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - name: http
      port: 30080
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: new-api-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      initContainers:
        - name: wait-for-backends
          image: busybox:1.37
          command:
            - sh
            - -c
            - until wget -q -O - http://control:3000/healthz | grep -q control && wget -q -O - http://relay:3000/healthz | grep -q relay; do sleep 2; done
      containers:
        - name: web
          image: new-api-web:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
