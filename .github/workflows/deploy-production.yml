name: Deploy production

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA to deploy (default is the current production release)
        type: string
        default: 8cfc1906efec25918d0a7cd575cabbc867b42512
        required: true
      scope:
        description: Deployment scope
        type: choice
        options: [full, frontend]
        default: full
        required: true

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify deployment scripts
        run: |
          bash -n backend/deploy/ci/activate.sh backend/deploy/ci/publish.sh
          python3 backend/deploy/ci/test_activate.py
      - name: Validate release commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Set up Node.js test runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: Verify and build frontend
        working-directory: source/frontend
        run: |
          bun install --frozen-lockfile
          bun add --dev --no-save esbuild@0.21.5
          bun run typecheck
          bun run lint
          mapfile -d '' tests < <(git ls-files -z -- 'src/**/*.test.ts' 'src/**/*.test.tsx' 'src/**/*.test.js' 'src/**/*.test.mjs')
          node scripts/test-with-dom.mjs "${tests[@]}"
          bun run build
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: inputs.scope == 'full'
        with:
          go-version-file: source/backend/go.mod
          cache-dependency-path: |
            source/backend/go.sum
            source/backend/relaykit/go.sum
      - name: Verify backend modules
        working-directory: source
        if: inputs.scope == 'full'
        run: |
          make test
          cd backend/relaykit
          GOWORK=off go build ./...
      - name: Build locked split binaries
        if: inputs.scope == 'full'
        working-directory: source/backend
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
          GOWORK: 'off'
        run: |
          mkdir -p ../../artifacts
          go build -tags split -ldflags '-s -w -X main.DefaultServerRole=control -X main.LockedServerRole=control' -o ../../artifacts/new-api-control .
          go build -tags split -ldflags '-s -w -X main.DefaultServerRole=relay -X main.LockedServerRole=relay' -o ../../artifacts/new-api-relay .
      - name: Package frontend
        run: |
          mkdir -p artifacts
          tar -C source/frontend/dist -czf artifacts/frontend.tar.gz .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-${{ inputs.source_sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      CONTROL_HOST: ${{ vars.CONTROL_HOST }}
      RELAY_HOST: ${{ vars.RELAY_HOST }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-${{ inputs.source_sha }}
          path: artifacts
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          umask 077
          if [[ -n "$DEPLOY_SSH_KEY" ]]; then
            printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          fi
          sudo apt-get update -qq
          sudo apt-get install -y sshpass
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy and verify
        env:
          DEPLOY_SCOPE: ${{ inputs.scope }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: bash backend/deploy/ci/publish.sh "$DEPLOY_SCOPE" "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$SOURCE_SHA"
      - name: Remove runner credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
