<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d"><title id="t">网关重试状态机</title><desc id="d">请求失败后根据 skip retry、渠道错误、状态码和次数决定重试、切换或返回。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6z" fill="#496d99"/></marker><style>.b{stroke:#496d99;stroke-width:2;fill:none;marker-end:url(#a)}.r{stroke:#be123c;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#a)}.x{font:700 15px sans-serif;fill:#182230}.s{font:12px sans-serif;fill:#5b6b7f}.d{fill:#fff5e7;stroke:#e09a3e;stroke-width:2}.g{fill:#e6f7f0;stroke:#2c9b78;stroke-width:2}.e{fill:#fff0f3;stroke:#df5172;stroke-width:2}</style></defs><rect class="g" x="40" y="175" width="150" height="60" rx="12"/><text class="x" x="115" y="211" text-anchor="middle">Request A</text><rect class="d" x="280" y="175" width="190" height="60" rx="12"/><text class="x" x="375" y="211" text-anchor="middle">Provider Response</text><path class="b" d="M190 205h90"/><path class="r" d="M375 175V80"/><path class="r" d="M375 235v100"/><rect class="d" x="270" y="20" width="210" height="60" rx="12"/><text class="x" x="375" y="56" text-anchor="middle">shouldRetry?</text><rect class="g" x="600" y="20" width="170" height="60" rx="12"/><text class="x" x="685" y="56" text-anchor="middle">选下一渠道</text><rect class="e" x="600" y="300" width="170" height="60" rx="12"/><text class="x" x="685" y="336" text-anchor="middle">Refund / Return</text><path class="b" d="M480 50h120"/><path class="b" d="M770 50c110 0 110 155-80 155"/><path class="b" d="M470 335h130"/><text class="s" x="495" y="42">true</text><text class="s" x="485" y="325">false / exhausted</text><text class="s" x="390" y="115">affinity skip / specific channel / status code / channel error</text><text class="s" x="585" y="185">BodyStorage rewind → RetryParam++ → SetupContext</text></svg>
