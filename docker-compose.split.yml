services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: new-api-web:local
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      control:
        condition: service_healthy
      relay:
        condition: service_healthy
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/healthz | grep -q '\"success\":true'"]
      interval: 30s
      timeout: 5s
      retries: 3

  control:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        SERVER_ROLE: control
    image: new-api-control:local
    restart: always
    command: ["--log-dir", "/app/logs"]
    volumes:
      - app_data:/data
      - ./logs/control:/app/logs
    environment:
      SQL_DSN: ${SQL_DSN:-}
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CRYPTO_SECRET: ${CRYPTO_SECRET:?CRYPTO_SECRET is required}
      NODE_TYPE: master
      NODE_NAME: new-api-control-1
      TZ: Asia/Shanghai
      ERROR_LOG_ENABLED: "true"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/healthz | grep -q '\"role\":\"control\"'"]
      interval: 30s
      timeout: 5s
      retries: 5

  relay:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        SERVER_ROLE: relay
    image: new-api-relay:local
    restart: always
    command: ["--log-dir", "/app/logs"]
    volumes:
      - app_data:/data
      - ./logs/relay:/app/logs
    environment:
      SQL_DSN: ${SQL_DSN:-}
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CRYPTO_SECRET: ${CRYPTO_SECRET:?CRYPTO_SECRET is required}
      NODE_TYPE: slave
      NODE_NAME: new-api-relay-1
      TZ: Asia/Shanghai
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
    depends_on:
      control:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/healthz | grep -q '\"role\":\"relay\"'"]
      interval: 30s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    restart: always
    environment:
      POSTGRES_USER: newapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-configure-before-enabling-postgres}
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newapi -d new-api"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-configure-before-enabling-mysql}
      MYSQL_DATABASE: new-api
      MYSQL_USER: newapi
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-configure-before-enabling-mysql}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p'$${MYSQL_ROOT_PASSWORD}' --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_data:/data
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$${REDIS_PASSWORD}' ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  app_data:
  pg_data:
  mysql_data:
  redis_data:

networks:
  new-api-network:
    driver: bridge
