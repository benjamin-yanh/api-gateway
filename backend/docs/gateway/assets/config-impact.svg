<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 450" role="img" aria-labelledby="t d"><title id="t">配置影响关系</title><desc id="d">环境变量、GlobalConfig、数据库字段和请求字段共同影响网关阶段。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6z" fill="#496d99"/></marker><style>.b{stroke:#496d99;stroke-width:2;fill:none;marker-end:url(#a)}.x{font:700 14px sans-serif;fill:#182230}.s{font:12px sans-serif;fill:#5b6b7f}.n{fill:#e9f0ff;stroke:#6a8fd2;stroke-width:2}.g{fill:#e6f7f0;stroke:#2c9b78;stroke-width:2}.o{fill:#fff5e7;stroke:#e09a3e;stroke-width:2}</style></defs><text class="x" x="65" y="35">来源</text><text class="x" x="450" y="35">网关阶段</text><text class="x" x="850" y="35">影响</text><rect class="n" x="50" y="70" width="260" height="58" rx="10"/><text class="x" x="180" y="104" text-anchor="middle">ENV / common constants</text><rect class="n" x="50" y="155" width="260" height="58" rx="10"/><text class="x" x="180" y="189" text-anchor="middle">GlobalConfig / operation</text><rect class="n" x="50" y="240" width="260" height="58" rx="10"/><text class="x" x="180" y="274" text-anchor="middle">Channel / Token DB</text><rect class="n" x="50" y="325" width="260" height="58" rx="10"/><text class="x" x="180" y="359" text-anchor="middle">Request fields</text><rect class="g" x="410" y="125" width="250" height="58" rx="10"/><text class="x" x="535" y="159" text-anchor="middle">Auth / Limit / Dispatch</text><rect class="g" x="410" y="220" width="250" height="58" rx="10"/><text class="x" x="535" y="254" text-anchor="middle">Relay / Billing</text><rect class="g" x="410" y="315" width="250" height="58" rx="10"/><text class="x" x="535" y="349" text-anchor="middle">Adaptor / Provider</text><rect class="o" x="800" y="125" width="220" height="58" rx="10"/><text class="x" x="910" y="159" text-anchor="middle">权限、限流、渠道</text><rect class="o" x="800" y="220" width="220" height="58" rx="10"/><text class="x" x="910" y="254" text-anchor="middle">Token、价格