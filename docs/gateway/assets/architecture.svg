<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">网关分层架构</title><desc id="d">请求平面由客户端、路由、中间件、Relay 和适配器组成，支撑平面提供数据库、缓存、配置、计费与观测。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6z" fill="#496d99"/></marker><style>.lane{fill:#f8fbff;stroke:#d4dfeb;stroke-width:1.4}.b{stroke:#496d99;stroke-width:2;fill:none;marker-end:url(#a)}.s{stroke:#7b61a8;stroke-width:1.8;fill:none;stroke-dasharray:7 5}.x{font:700 15px sans-serif;fill:#182230}.h{font:700 13px sans-serif;fill:#315d9b}.z{font:12px sans-serif;fill:#5b6b7f}</style></defs><rect class="lane" x="20" y="20" width="1160" height="180" rx="16"/><text class="h" x="42" y="48">请求平面</text><rect x="60" y="90" width="180" height="56" rx="10" fill="#e9f0ff" stroke="#6a8fd2"/><text class="x" x="150" y="123" text-anchor="middle">Client / SDK</text><rect x="300" y="90" width="180" height="56" rx="10" fill="#e9f0ff" stroke="#6a8fd2"/><text class="x" x="390" y="123" text-anchor="middle">Router</text><rect x="540" y="90" width="200" height="56" rx="10" fill="#e6f7f0" stroke="#2c9b78"/><text class="x" x="640" y="123" text-anchor="middle">Middleware</text><rect x="800" y="90" width="180" height="56" rx="10" fill="#f0eaff" stroke="#9b72df"/><text class="x" x="890" y="123" text-anchor="middle">Controller / Relay</text><rect x="1040" y="90" width="110" height="56" rx="10" fill="#e9f0ff" stroke="#6a8fd2"/><text class="x" x="1095" y="123" text-anchor="middle">Adaptor</text><path class="b" d="M240 118h60"/><path class="b" d="M480 118h60"/><path class="b" d="M740 118h60"/><path class="b" d="M980 118h60"/><rect class="lane" x="20" y="230" width="1160" height="190" rx="16"/><text class="h" x="42" y="258">下游平面</text><rect x="180" y="310" width="220" height="58" rx="10" fill="#e9f0ff" stroke="#6a8fd2"/><text class="x" x="290" y="344" text-anchor="middle">Provider APIs</text><rect x="490" y="310" width="220" height="58" rx="10" fill="#e9f0ff" stroke="#6a8fd2"/><text class="x" x="600" y="344" text-anchor="middle">HTTP / SSE / WS</text><rect x="800" y="310" width="220" height="58" rx="10" fill="#e6f7f0" stroke="#2c9b78"/><text class="x" x="910" y="344" text-anchor="middle">Normalized Response</text><path class="b" d="M1095 146v164H400"/><path class="b" d="M400 339h90"/><path class="b" d="M710 339h90"/><rect class="lane" x="20" y="450" width="1160" height="240" rx="16"/><text class="h" x="42" y="478">支撑平面（虚线表示依赖，不代表每个请求都同步访问）</text><rect x="70" y="530" width="190" height="58" rx="10" fill="#fff5e7" stroke="#e09a3e"/><text class="x" x="165" y="564" text-anchor="middle">Main / Log DB</text><rect x="330" y="530" width="190" height="58" rx="10" fill="#fff5e7" stroke="#e09a3e"/><text class="x" x="425" y="564" text-anchor="middle">Redis / Memory</text><rect x="590" y="530" width="190" height="58" rx="10" fill="#fff5e7" stroke="#e09a3e"/><text class="x" x="685" y="564" text-anchor="middle">Settings / Ratios</text><rect x="850" y="530" width="190" height="58" rx="10" fill="#fff5e7" stroke="#e09a3e"/><text class="x" x="945" y="564" text-anchor="middle">Billing / Metrics</text><path class="s" d="M640 146v384H520"/><path class="s" d="M890 146v384H780"/><path class="s" d="M910 368v162H1040"/><path class="s" d="M165 530V368H180"/><text class="z" x="70" y="630">GORM：SQLite / MySQL / PostgreSQL</text><text class="z" x="590" y="630">配置影响路由、计费和可靠性</text></svg>
