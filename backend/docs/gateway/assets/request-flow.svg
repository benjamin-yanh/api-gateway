<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">网关请求主流程</title><desc id="d">客户端经过路由、中间件、Relay、适配器和供应商，响应再经过结算返回客户端。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6z" fill="#446b98"/></marker><style>.l{fill:#f8fbff;stroke:#d4dfeb;stroke-width:1.5}.b{stroke:#446b98;stroke-width:2;fill:none;marker-end:url(#a)}.x{font:700 16px sans-serif;fill:#1b2a3a}.s{font:12px sans-serif;fill:#5b6b7f}.h{font:700 13px sans-serif;fill:#315d9b}</style></defs><rect class="l" x="20" y="20" width="1160" height="130" rx="16"/><text class="h" x="42" y="48">客户端</text><rect x="80" y="70" width="220" height="52" rx="10" fill="#e9f0ff" stroke="#6a8fd2"/><text class="x" x="190" y="101" text-anchor="middle">HTTP / SSE / WebSocket</text><rect class="l" x="20" y="175" width="1160" height="150" rx="16"/><text class="h" x="42" y="203">入口与策略</text><rect x="70" y="230" width="220" height="56" rx="10" fill="#e6f7f0" stroke="#2c9b78"/><text class="x" x="180" y="263" text-anchor="middle">Router + Middleware</text><rect x="380" y="230" width="220" height="56" rx="10" fill="#e6f7f0" stroke="#2c9b78"/><text class="x" x="490" y="263" text-anchor="middle">TokenAuth / RateLimit</text><rect x="690" y="230" width="250" height="56" rx="10" fill="#fff5e7" stroke="#e09a3e"/><text class="x" x="815" y="263" text-anchor="middle">Distribute / Channel</text><path class="b" d="M190 122v108"/><path class="b" d="M290 258h90"/><path class="b" d="M600 258h90"/><rect class="l" x="20" y="350" width="1160" height="160" rx="16"/><text class="h" x="42" y="378">Relay 核心</text><rect x="75" y="405" width="210" height="56" rx="10" fill="#f0eaff" stroke="#9b72df"/><text class="x" x="180" y="438" text-anchor="middle">Validate + RelayInfo</text><rect x="360" y="405" width="210" height="56" rx="10" fill="#f0eaff" stroke="#9b72df"/><text class="x" x="465" y="438" text-anchor="middle">Estimate + Price</text><rect x="645" y="405" width="210" height="56" rx="10" fill="#f0eaff" stroke="#9b72df"/><text class="x" x="750" y="438" text-anchor="middle">PreConsume + Retry</text><path class="b" d="M815 286v119H570"/><path class="b" d="M285 433h75"/><path class="b" d="M570 433h75"/><rect class="l" x="20" y="535" width="1160" height="205" rx="16"/><text class="h" x="42" y="563">下游与回流</text><rect x="75" y="590" width="220" height="56" rx="10" fill="#e9f0ff" stroke="#6a8fd2"/><text class="x" x="185" y="623" text-anchor="middle">Adaptor Convert</text><rect x="370" y="590" width="220" height="56" rx="10" fill="#e9f0ff" stroke="#6a8fd2"/><text class="x" x="480" y="623" text-anchor="middle">Provider DoRequest</text><rect x="665" y="590" width="220" height="56" rx="10" fill="#e6f7f0" stroke="#2c9b78"/><text class="x" x="775" y="623" text-anchor="middle">DoResponse / Stream</text><rect x="960" y="590" width="150" height="56" rx="10" fill="#e6f7f0" stroke="#2c9b78"/><text class="x" x="1035" y="623" text-anchor="middle">Settle / Log</text><path class="b" d="M750 461v129H295"/><path class="b" d="M295 618h75"/><path class="b" d="M590 618h75"/><path class="b" d="M885 618h75"/><path class="b" d="M1035 590V320"/><text class="s" x="1045" y="460">响应/日志回流</text></svg>
